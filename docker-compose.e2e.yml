# Throwaway stack for automated tests (never use for real data):
#   node e2e/run.mjs          # builds, starts, runs API + browser tests, tears everything down
#
# Own project name and port, an empty throwaway MongoDB container (memory only, never Atlas), mail in dry-run mode, rate limits off.
name: sandvalley-e2e

services:
  mongo:
    image: mongo:7
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/e2e
      JWT_SECRET: e2e-only-secret-e2e-only-secret-e2e-only
      PUBLIC_BASE_URL: http://localhost:${E2E_PORT:-8090}
      UPLOAD_DIR: /data/uploads
      MAIL_DRY_RUN: "1"
      RATE_LIMIT_OFF: "1"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: E2E-admin-pass-1
      ADMIN_EMAIL: admin@e2e.test
      ADMIN_NAME: E2E Admin
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${E2E_PORT:-8090}:80"
    volumes:
      - uploads:/data/uploads:ro

volumes:
  uploads:
