# Sand Valley on one machine: API + dashboard (nginx). The database is MongoDB Atlas (cloud), not a container.
#
#   cp .env.example .env        # then fill it in (MONGO_URI = your Atlas connection string)
#   docker compose up -d --build
#   docker compose run --rm backend node backend/scripts/seed.mjs     # first time only: creates the admin
#
# Open http://<server>:${WEB_PORT}  (put a TLS proxy in front for HTTPS).
# In Atlas: Network Access must allow this server's IP address.
name: sandvalley

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5003:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:?set MONGO_URI in .env (MongoDB Atlas connection string, mongodb+srv://...)}
      MONGO_DB: ${MONGO_DB:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env (the address people use, no trailing slash)}
      UPLOAD_DIR: /data/uploads
      # used by scripts/seed.mjs
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    volumes:
      - uploads:/data/uploads
    # reachable inside the compose network as backend:5000, not published

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - uploads:/data/uploads:ro

volumes:
  uploads:
