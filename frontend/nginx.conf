# Public entry point: the dashboard, the API under /api and the uploaded images under /uploads.

# If a TLS proxy sits in front (Caddy, Cloudflare...), keep its X-Forwarded-Proto; otherwise use ours.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # images are shrunk by the API, but the upload itself can be up to 10 MB
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server_tokens off;
    include /etc/nginx/security-headers.conf;

    # Behind a TLS proxy (Caddy, Cloudflare, a host nginx) the TCP peer is the proxy. Trust its
    # X-Forwarded-For only when it comes from a private address, so the API's rate limiting sees
    # the real visitor and a public client cannot fake its IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API (the backend container). Host and client IP are passed on for absolute URLs and rate limiting.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr; # already the real visitor (see real_ip above)
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Uploaded images are read straight from the shared volume: no Node process involved.
    # File names are random and never change, so they can be cached forever.
    location /uploads/ {
        alias /data/uploads/;
        autoindex off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        include /etc/nginx/security-headers.conf;
    }

    # Vite output has content hashes in the file names
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # index.html must always be revalidated so new releases show up
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # single-page app: unknown paths (/users, /seeds/...) are handled by the router
    location / {
        try_files $uri /index.html;
    }
}
